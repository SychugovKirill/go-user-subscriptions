services:
  app:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    env_file:
      - .env
    environment:
      PG_URL: postgres://user:password@postgres:5432/subscriptions?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d subscriptions"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "always"

  migrations:
    build:
      context: .
      dockerfile: ./build/migrations.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - goose
      - -dir
      - /migrations
      - postgres
      - postgres://user:password@postgres:5432/subscriptions?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro

volumes:
  postgres-data:
